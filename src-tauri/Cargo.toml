[package]
name = "beautiful_batches_tauri"
version = "0.3.0"
description = "Beautiful Batches desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = true }
imageproc = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rfd = "0.15"
urlencoding = "2"
zip = { version = "2", default-features = true }
