[package]
name = "beautiful_batches_tauri"
version = "0.5.0"
description = "Beautiful Batches desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = true }
imageproc = "0.25"
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", features = ["ndarray", "rocm", "directml", "coreml"] }
rayon = "1.10"
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rfd = "0.15"
urlencoding = "2"
zip = { version = "2", default-features = true }
