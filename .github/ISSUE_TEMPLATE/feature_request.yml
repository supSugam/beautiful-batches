name: Feature request
description: Suggest an improvement or new capability
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Share the workflow pain first, then the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard today?
      placeholder: Describe the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change?
      placeholder: Describe expected behavior, UI, and output.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Any workaround or other approach you tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Explorer / selection
        - Gallery / curation
        - Inspector / editing
        - Export planner / output
        - Performance
        - Other
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References or mockups
      description: Links, sketches, screenshots, or examples from other tools.
